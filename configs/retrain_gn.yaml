# GroupNorm retrain config (per-process path; used to validate the vmap ensemble).
seed: 42
norm: group
gn_groups: 8

lr: 0.001
lr_grid: [0.00003, 0.0001, 0.0003, 0.001]
weight_decay: 0.0005
betas: [0.9, 0.999]
batch_size: 128
num_workers: 4

budget_fraction: 0.10
recovery_loss_margin: 0.0
warmup_steps: 100
eval_every_steps: 20

distill_T: 4.0
distill_alpha: 0.9
warmup_epochs: 5
